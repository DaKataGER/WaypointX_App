name: Windows-Installer bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link in config.json pruefen
        shell: pwsh
        run: |
          $url = (Get-Content config.json -Raw | ConvertFrom-Json).url
          if ($url -notmatch '^https://script\.google\.com/.+/exec$') {
            Write-Error "In config.json ist noch kein gueltiger Web-App-Link eingetragen."
            exit 1
          }

      - name: Pruefen, ob diese Version schon veroeffentlicht ist
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          $gibtEs = ($LASTEXITCODE -eq 0)
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($gibtEs) { "neu=false" >> $env:GITHUB_OUTPUT; Write-Host "Version $v gibt es schon - nur bauen." }
          else { "neu=true" >> $env:GITHUB_OUTPUT; Write-Host "Version $v ist neu - wird als Update veroeffentlicht." }
          exit 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhaengigkeiten installieren
        run: npm install

      - name: Installer bauen
        run: npm run dist

      - name: Als Update veroeffentlichen
        if: steps.version.outputs.neu == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $dateien = @(Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(exe|blockmap)$' -or $_.Name -eq 'latest.yml' } | ForEach-Object { $_.FullName })
          if (-not ($dateien | Where-Object { $_ -like '*latest.yml' })) { Write-Error "latest.yml fehlt"; exit 1 }
          gh release create "v$v" @dateien --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Waypoint X $v" --notes "Automatisches Update auf Version $v."

      - name: Installer bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: WaypointX-Setup
          path: dist/*.exe
          if-no-files-found: error
