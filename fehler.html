<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
<title>Waypoint X</title>
<style>
  html, body { margin: 0; height: 100%; background: #0B0B0C; color: #EDE6DA; font-family: "Segoe UI", Arial, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  .karte { width: 440px; text-align: center; padding: 40px 36px; border: 1px solid #2a2722; border-radius: 14px; background: #131315; }
  img { width: 92px; height: 92px; opacity: .9; }
  h1 { margin: 18px 0 10px; font-size: 15px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: #C9A46A; }
  p { margin: 0 0 26px; font-size: 14px; line-height: 1.6; color: #a59d90; }
  a.btn { display: inline-block; padding: 11px 26px; border-radius: 8px; text-decoration: none; font-size: 12px; font-weight: 600; letter-spacing: .16em;
          text-transform: uppercase; color: #0B0B0C; background: linear-gradient(135deg, #8C6A3C, #E8CFA0 50%, #C9A46A); }
  small { display: block; margin-top: 18px; font-size: 11px; color: #5d574e; }
</style>
</head>
<body>
  <div class="karte">
    <img src="emblem.png" alt="">
    <h1 id="titel">Keine Verbindung</h1>
    <p id="text">Waypoint X ist gerade nicht erreichbar. Bitte prüfe deine Internetverbindung und versuche es erneut.</p>
    <a class="btn" id="btn" href="waypointx://neu-laden">Erneut versuchen</a>
    <small id="info"></small>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('art') === 'konfig') {
    document.getElementById('titel').textContent = 'Nicht eingerichtet';
    document.getElementById('text').textContent = 'In dieser Version ist kein gültiger Link zur Waypoint-X-Web-App hinterlegt. Bitte wende dich an die Geschäftsführung.';
    document.getElementById('btn').style.display = 'none';
  } else if (q.get('code')) {
    document.getElementById('info').textContent = 'Fehlercode ' + q.get('code');
  }
</script>
</body>
</html>
