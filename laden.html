<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'">
<title>Waypoint X</title>
<style>
  html, body { margin: 0; height: 100%; background: #0B0B0C; color: #E8CFA0; font-family: "Segoe UI", Arial, sans-serif; user-select: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
  img { width: 150px; height: 150px; animation: puls 2.4s ease-in-out infinite; }
  h1 { margin: 0; font-weight: 600; font-size: 22px; letter-spacing: .42em; padding-left: .42em; color: #C9A46A; }
  p { margin: 0; font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: #8C6A3C; }
  .balken { width: 180px; height: 2px; background: #1c1b19; overflow: hidden; border-radius: 2px; }
  .balken i { display: block; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, #C9A46A, transparent); animation: lauf 1.4s ease-in-out infinite; }
  @keyframes puls { 0%, 100% { opacity: .85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.03); } }
  @keyframes lauf { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
</style>
</head>
<body>
  <img src="emblem.png" alt="">
  <h1>WAYPOINT X</h1>
  <div class="balken"><i></i></div>
  <p>Wird geladen</p>
</body>
</html>
